<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FM Voice Modem</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --blue: #58a6ff; --green: #3fb950; --red: #f85149;
    --yellow: #e3b341; --text: #c9d1d9; --muted: #484f58;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Courier New', monospace;
    min-height: 100vh; display: flex;
    align-items: center; justify-content: center; padding: 16px;
  }
  .app {
    width: 100%; max-width: 440px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 24px;
    box-shadow: 0 0 40px rgba(88,166,255,.08);
  }
  h1 {
    text-align: center; color: var(--blue);
    font-size: 1rem; letter-spacing: 4px; margin-bottom: 8px;
  }
  .legal-note {
    text-align: center; font-size: .68rem;
    color: var(--muted); margin-bottom: 20px; letter-spacing: 1px;
  }
  .status-bar {
    display: flex; align-items: center; gap: 10px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 12px;
    margin-bottom: 16px; font-size: .8rem;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.ok  { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot.err { background: var(--red); }
  .mode {
    text-align: center; font-size: 1.5rem;
    font-weight: bold; letter-spacing: 6px;
    padding: 10px; border-radius: 8px;
    margin-bottom: 20px; border: 1px solid;
    transition: all .2s;
  }
  .mode.rx { color: var(--blue); border-color: #1565c0; background: #0d1b2e; }
  .mode.tx {
    color: var(--red); border-color: #7f1d1d; background: #2d0a0a;
    animation: blink .6s step-start infinite;
  }
  @keyframes blink { 50% { opacity:.5; } }
  .section { margin-bottom: 16px; }
  label {
    display: block; font-size: .72rem; color: var(--muted);
    letter-spacing: 1px; margin-bottom: 4px; text-transform: uppercase;
  }
  select {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); padding: 8px 10px; border-radius: 6px;
    font-family: inherit; font-size: .85rem; margin-bottom: 10px;
    transition: border-color .2s;
  }
  select:focus { outline: none; border-color: var(--blue); }
  .btn {
    width: 100%; padding: 10px; border: none; border-radius: 6px;
    font-family: inherit; font-size: .85rem;
    letter-spacing: 2px; cursor: pointer; transition: all .15s;
  }
  .btn-config { background: #1f6feb; color: #fff; margin-bottom: 20px; }
  .btn-config:hover { background: #388bfd; }
  .btn-config:disabled { opacity: .4; cursor: not-allowed; }
  .ptt-wrap { text-align: center; margin-bottom: 20px; }
  #ptt {
    width: 160px; height: 160px; border-radius: 50%;
    border: 3px solid #1565c0;
    background: radial-gradient(circle at 40% 35%, #1a237e, #0a0d3a);
    color: var(--blue); font-family: inherit;
    font-size: .95rem; font-weight: bold;
    letter-spacing: 4px; cursor: pointer;
    box-shadow: 0 0 30px rgba(88,166,255,.15), inset 0 -3px 8px rgba(0,0,0,.4);
    transition: all .1s; user-select: none; -webkit-user-select: none;
    position: relative;
  }
  #ptt::after {
    content: ''; position: absolute;
    top: 12%; left: 25%; width: 50%; height: 25%;
    background: rgba(255,255,255,.07);
    border-radius: 50%; pointer-events: none;
  }
  #ptt.active, #ptt:active {
    background: radial-gradient(circle at 40% 35%, #7f0000, #3d0000);
    border-color: #b71c1c; color: var(--red);
    box-shadow: 0 0 40px rgba(248,81,73,.3), inset 0 -3px 8px rgba(0,0,0,.5);
    transform: scale(.96);
  }
  #ptt:disabled { opacity: .3; cursor: not-allowed; transform: none !important; }
  .ptt-hint { font-size: .7rem; color: var(--muted); margin-top: 10px; }
  kbd {
    background: var(--border); border-radius: 3px;
    padding: 1px 5px; font-family: inherit; font-size: .7rem;
  }
  .log {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; padding: 10px;
    height: 88px; overflow-y: auto; font-size: .72rem;
    color: var(--green); line-height: 1.6;
  }
  .log .err  { color: var(--red); }
  .log .info { color: var(--yellow); }
  .spectrum {
    height: 48px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 6px;
    margin-bottom: 16px; overflow: hidden;
  }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="app">
  <h1>◈ FM VOICE MODEM ◈</h1>
  <div class="legal-note">SIN CIFRADO · TRANSMISIÓN EN CLARO · USO AMATEUR</div>

  <div class="status-bar">
    <div class="dot" id="conn-dot"></div>
    <span id="status-txt">Iniciando…</span>
  </div>

  <div class="mode rx" id="mode">RX</div>

  <div class="spectrum">
    <canvas id="spec" height="48"></canvas>
  </div>

  <div class="section">
    <label>Entrada ← Radio / Micrófono</label>
    <select id="in-dev"><option value="">[ Por defecto ]</option></select>

    <label>Salida → Radio / Parlante</label>
    <select id="out-dev"><option value="">[ Por defecto ]</option></select>

    <button class="btn btn-config" id="btn-cfg" onclick="configure()">
      [ CONFIGURAR ]
    </button>
  </div>

  <div class="ptt-wrap">
    <button id="ptt" disabled
      onmousedown="pttOn(event)" onmouseup="pttOff(event)" onmouseleave="pttOff(event)"
      ontouchstart="pttOn(event)" ontouchend="pttOff(event)">
      PTT
    </button>
    <div class="ptt-hint">
      Mantené presionado · o usá <kbd>ESPACIO</kbd>
    </div>
  </div>

  <div class="log" id="log"></div>
</div>
